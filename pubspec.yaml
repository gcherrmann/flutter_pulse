name: flutter_template
description: "A new Flutter project."

publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  freezed: ^3.2.3
  json_annotation: ^4.9.0
  logger: ^2.6.1
  http: ^1.5.0
  flutter_svg: ^2.2.1
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  build_runner: ^2.8.0
  validatorless: ^1.2.4
  command_it: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
